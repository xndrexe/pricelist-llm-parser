[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricelist-llm-parser"
version = "0.1.0"
description = "CLI-парсер прайс-листов в разнородных форматах (xlsx/csv/html/json) в единую Pydantic-схему, с опциональной LLM-разметкой колонок через локальную Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Kostiukhov", email = "skostuhov@gmail.com" }]
keywords = ["pricelist", "parser", "etl", "llm", "ollama", "pydantic", "xlsx", "csv"]

dependencies = [
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pricelist-parser = "pricelist_parser.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pricelist_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001", # Cyrillic letters in strings — это инструмент с русскоязычными прайсами
    "RUF002", # То же — для docstrings
    "RUF003", # То же — для комментариев
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
